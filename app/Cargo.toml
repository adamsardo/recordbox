[package]
name = "recordbox"
version = "0.1.0"
edition = "2021"
description = "Local DJ library, track analysis, set preparation and Pioneer-compatible USB export"

[[bin]]
name = "recordbox"
path = "src/main.rs"

[dependencies]
eframe = "0.31.1"
winit = "0.30"
muda = "0.21"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher", "backup"] }
symphonia = { version = "0.5.5", features = ["all"] }
lofty = "0.22"
cpal = "0.15"
rustfft = "6.4"
rfd = "0.15"
quick-xml = "0.41"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
anyhow = "1"
chrono = "0.4"
walkdir = "2.5"
dirs = "5"
unicode-normalization = "0.1"
rand = "0.8"
# Stem separation (open HTDemucs models, pure-Rust inference).
candle-core = "0.9"
candle-nn = "0.9"
sha2 = "0.10"
ureq = "2"
# Library backup archives (stored entries only: the database is small and audio/artwork
# are compressed already).
zip = { version = "7", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.9", features = ["metal"] }
candle-nn = { version = "0.9", features = ["metal"] }

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
